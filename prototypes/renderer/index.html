<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>描画試作</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header>
      <select id="file">
        <option value="musicxml/synthetic-orchestra-500.musicxml">合成オーケストラ 500小節（18パート）</option>
        <option value="musicxml/beethoven-op18-1.mxl">ベートーヴェン Op.18-1（4パート）</option>
        <option value="musicxml/mozart-k464-1-allegro.mxl">モーツァルト K.464 第1楽章</option>
        <option value="musicxml/mozart-k387.mxl">モーツァルト K.387</option>
      </select>
      <label>分割 <select id="size"><option>2</option><option>4</option><option selected>8</option><option>16</option></select>小節</label>
      <label class="file-pick">ファイルを開く<input id="local" type="file" accept=".musicxml,.xml,.mxl" /></label>
      <span id="status">読み込み中…</span>
    </header>
    <main id="score"></main>
    <footer id="toolbar">
      <span id="selected">音符をタップして選択</span>
      <button id="up" disabled>▲ 上</button>
      <button id="down" disabled>▼ 下</button>
      <button id="dur" disabled>♯ 付け外し</button>
      <span id="timing"></span>
    </footer>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
