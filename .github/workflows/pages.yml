# アプリを GitHub Pages に公開する（スマホ・タブレットの実機で触るため）。
# 描画の試作（prototypes/renderer）も /prototype/ に置く。
# 使う前に：リポジトリの Settings → Pages → Source を「GitHub Actions」にする。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            prototypes/renderer/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: 描画の試作
        working-directory: prototypes/renderer
        run: npm ci && npm run build
      - run: cp -r prototypes/renderer/dist dist/prototype
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
