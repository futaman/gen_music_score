# 描画の試作（prototypes/renderer）を GitHub Pages に置き、スマホ・タブレットの実機で触れるようにする。
# 使う前に：リポジトリの Settings → Pages → Source を「GitHub Actions」にする。
name: Prototype to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['prototypes/renderer/**', 'test-assets/**', '.github/workflows/prototype-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototypes/renderer/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototypes/renderer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
